<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Private</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #1f1f26;
    color: #f0f0f3;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    cursor: default;
  }
  main { display: grid; justify-items: center; gap: 6px; margin-block-end: 8vh; }
  .mark { color: #9a9aa3; margin-block-end: 14px; }
  .time {
    font-size: 64px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .date { color: #9a9aa3; font-size: 15px; }
  .note {
    position: fixed;
    inset-inline: 0;
    bottom: 28px;
    margin: 0 auto;
    padding-inline: 24px;
    color: #6c6c73;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <svg class="mark" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 11h18"/>
    <path d="M5 11l1.6-5.2A1.5 1.5 0 0 1 8.4 4.8L12 6l3.6-1.2a1.5 1.5 0 0 1 1.8 1L19 11"/>
    <circle cx="7" cy="16.5" r="2.5"/>
    <circle cx="17" cy="16.5" r="2.5"/>
    <path d="M9.5 16.5c1.6-1 3.4-1 5 0"/>
  </svg>
  <time class="time" id="time"></time>
  <span class="date" id="date"></span>
</main>
<p class="note">Site data from this window is discarded when it closes.</p>
<script>
  const time = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
  const date = new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long" });
  function tick() {
    const now = new Date();
    document.getElementById("time").textContent = time.format(now);
    document.getElementById("date").textContent = date.format(now);
    setTimeout(tick, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()));
  }
  tick();
</script>
</body>
</html>
