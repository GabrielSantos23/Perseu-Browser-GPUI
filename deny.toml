# cargo-deny policy, run in CI with `cargo deny --locked check`.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# No exceptions needed for the Windows target; the Linux-only ones live in
# .cargo/audit.toml, which scans the whole lockfile (docs/SECURITY.md).
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
