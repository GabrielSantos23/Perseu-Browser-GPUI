[workspace]
resolver = "3"
members = ["crates/browser-core", "crates/webview-host", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-kit = { version = "=0.10.0", default-features = false, features = ["component"] }
gpui-ce-motion = { version = "=0.4.0", default-features = false }
wry = "=0.57.3"
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Media_Control"] }
raw-window-handle = "0.6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "=1.1.11"
directories = "6"
anyhow = "1"
psl = "=2.1.261"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GPUI compiles its DirectX shaders at runtime for every window when debug
# assertions are on, which delays each popup by about a second.
[profile.dev.package.gpui-pre-windows]
debug-assertions = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"
